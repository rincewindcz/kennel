# goodluckOS (github.com/CodeZombie/goodluckOS): appd supervises the launcher and one app at a time.
# The launcher is started from launcher_script; launching an app kills the launcher, and appd starts
# it again when the app exits.

[platform]
id=goodluckos
name=goodluckOS
launch=command
launch_command=doas appctl launch-application %c %t
terminal_flag=1
stop_app=doas appctl stop-application
kill_app=doas appctl kill-application
poweroff=doas /sbin/poweroff
reboot=doas /sbin/reboot
eject=doas umount /media/external
external_mount=/media/external
backlight=/sys/class/backlight/backlight
mixer_card=hw:0
mixer_volume=Headphone
mixer_output_switch=Speaker
sources=/usr/share/puppy/apps.puppy;~/apps.puppy;~/.local/share/applications/*.puppy
hide_categories=System
tail_categories=Emulators/Frontends;Terminal;System
autolaunch=~/autolaunch
app_log=/dev/shm/application/application.log
system_icons=/usr/share/icons
fallback_fonts=/usr/share/fonts/NotoSansSC.ttf
hud_env=GALLIUM_HUD_VISIBLE=true
launcher_script=~/.local/launcher.sh
previous_launcher=/usr/bin/puppy
kernel_log=dmesg
mounts=/;~;/media/external
width=640
height=480

[logs]
Last app=/dev/shm/application/application.log
Previous app=/dev/shm/application/application.log.old
Launcher=/dev/shm/application/launcher.log
USB gadget=/tmp/usb-gadget.log
glob=~/ports/*/*.log

[status]
appd=appctl status
